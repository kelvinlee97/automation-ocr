# Core Business Configuration - single source of configuration for all modules
# Modify this file to adjust business rules without changing the code

eligibility:
  # Brand whitelist (fuzzy match, case insensitive)
  eligible_brands:
    - "Samsung"
    - "Apple"
    - "Dyson"
    - "Panasonic"
    - "Sony"
  # Minimum spending threshold (RM)
  minimum_amount: 500.00
  # Brand fuzzy matching threshold (percentage), below which it is considered a mismatch
  brand_match_threshold: 85

bot:
  # User session timeout (minutes), you need to re-register after timeout
  session_timeout_minutes: 30
  # Maximum number of receipt submissions per user per day (anti-swipe)
  max_receipts_per_day: 5

excel:
  # Excel file path (relative to project root)
  file_path: "data/excel/records.xlsx"
  sheets:
    registrations:
      name: "Registrations"
      columns:
        - "serial number"
        - "Registration time"
        - "phone number"
        - "ID number"
        - "state"
    receipts:
      name: "Receipts"
      columns:
        - "serial number"
        - "Submission time"
        - "phone number"
        - "ID number"
        - "Document number"
        - "Identify the brand"
        - "Match brand"
        - "Consumption amount (RM)"
        - "Qualified or not"
        - "Reason for failure"
        - "OCR confidence"
        - "Image path"
