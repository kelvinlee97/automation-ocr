services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - wa-bot

  wa-bot:
    image: ${IMAGE_URI:-ghcr.io/kelvinlee97/claimflow:latest}
    container_name: wa-bot
    restart: always
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DATA_DIR=/opt/claimflow/data
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - ./config:/app/config:ro
      - ./data:/opt/claimflow/data
      - ./data/wwebjs_auth:/app/.wwebjs_auth
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
