name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  legacy-lint:
    name: Legacy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: wa-bot/package-lock.json

      - name: Install dependencies
        working-directory: wa-bot
        run: npm ci

      - name: Run lint
        working-directory: wa-bot
        run: npm run lint

      - name: Audit legacy runtime dependencies
        working-directory: wa-bot
        run: npm audit --audit-level=high

  legacy-test:
    name: Legacy test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: wa-bot/package-lock.json

      - name: Install dependencies
        working-directory: wa-bot
        run: npm ci

      - name: Run tests
        working-directory: wa-bot
        run: npm test
        env:
          # The test environment does not require a real key; the AI service is mocked during testing
          OPENAI_API_KEY: test-placeholder
          NODE_ENV: test

  new-runtime:
    name: Primary runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Check shared domain
        run: npm --workspace packages/domain run typecheck

      - name: Check worker
        run: npm --workspace apps/worker run typecheck && npm run worker:test

      - name: Check admin
        run: npm run admin:lint && npm --workspace apps/admin run typecheck && npm run admin:build

      - name: Audit new runtime dependencies
        run: npm audit --audit-level=high
