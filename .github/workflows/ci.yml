name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wa-bot/package-lock.json

      - name: Install dependencies
        working-directory: wa-bot
        run: npm ci

      - name: Run lint
        working-directory: wa-bot
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wa-bot/package-lock.json

      - name: Install dependencies
        working-directory: wa-bot
        run: npm ci

      - name: Run tests
        working-directory: wa-bot
        run: npm test
        env:
          # The test environment does not require real keys, geminiService will be mocked during testing
          GEMINI_API_KEY: test-placeholder
          NODE_ENV: test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    # Only verify the build after lint and test pass to avoid wasting build time
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t claimflow-ci ./wa-bot

      - name: Verify image startup (smoke test)
        run: |
          docker run --rm \
            -e GEMINI_API_KEY=test-placeholder \
            -e NODE_ENV=test \
            claimflow-ci node -e "console.log('smoke ok')"
