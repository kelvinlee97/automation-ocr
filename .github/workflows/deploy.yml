name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个部署任务运行
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Job 1：构建镜像并推送至 GHCR（在 GitHub runner 上完成）
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 初始化 Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ./wa-bot
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # Job 2：通过 SSH 部署到 DigitalOcean Droplet
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 5

    steps:
      - name: 部署到 Droplet（SSH）
        run: |
          # 设置 SSH key
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 添加 host key（避免首次连接确认）
          ssh-keyscan -H -p 22 ${{ secrets.DO_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

          # 执行部署命令
          ssh -i ~/.ssh/deploy_key -p 22 ${{ secrets.DO_SSH_USER }}@${{ secrets.DO_SSH_HOST }} <<'EOF'
            set -euo pipefail
            cd /opt/claimflow
            git fetch origin main
            git reset --hard origin/main
            docker compose pull

            had_running_bot=false
            if [ -n "$(docker compose ps -q wa-bot)" ]; then
              had_running_bot=true
              docker compose stop wa-bot
            fi

            rollback() {
              if [ "$had_running_bot" = true ]; then
                docker compose start wa-bot || true
              fi
            }
            trap rollback ERR

            if [ -f data/app.db ]; then
              docker compose run --rm --no-deps wa-bot \
                node scripts/migrate-add-campaign-fields.js --apply
            fi

            docker compose up -d --remove-orphans
            trap - ERR
            docker image prune -f
            docker compose ps

            health_status=$(docker compose exec -T wa-bot node -e '
              const http = require("http");
              const deadline = Date.now() + 60000;
              function check() {
                const req = http.get("http://127.0.0.1:3000/health", (res) => {
                  if (res.statusCode === 200 || res.statusCode === 503) {
                    process.stdout.write(String(res.statusCode));
                    process.exit(0);
                  }
                  retry();
                });
                req.setTimeout(5000, () => req.destroy());
                req.on("error", retry);
              }
              function retry() {
                if (Date.now() >= deadline) process.exit(1);
                setTimeout(check, 2000);
              }
              check();
            ')
            echo "ClaimFlow health endpoint returned HTTP ${health_status}"
          EOF
